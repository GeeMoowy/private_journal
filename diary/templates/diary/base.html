<!doctype html>
<html lang="ru">  <!-- Лучше указать конкретный язык -->
<head>
    {% load static %}
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{% block description %}Описание сайта{% endblock %}">
    <title>{% block title %}Мой сайт{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    {% block extra_css %}{% endblock %}  <!-- Для дополнительных CSS -->
</head>
<body>
    {% include 'includes/header.html' %}  <!-- Если есть хедер -->

    <main class="container mt-5">
        {% block content %}{% endblock %}
    </main>

    <script src="{% static 'js/bootstrap.bundle.min.js' %}" defer></script>
    {% block extra_js %}{% endblock %}  <!-- Для дополнительных JS -->
</body>
</html>
